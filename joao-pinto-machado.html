<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>João Pinto Machado — Automation &amp; Analytics Engineer</title>
<meta name="description" content="Seven chapters. Fifteen systems. Each one: what it is, how it was set up, what it delivered.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1313;
  --panel:#151A19;
  --panel-2:#222423;
  --line:rgba(240,238,232,.13);
  --line-2:rgba(240,238,232,.07);
  --white:#F2F0EA;
  --mute:#8E948F;
  --dim:#666B67;
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif;
  --sans:"Archivo",Helvetica,system-ui,sans-serif;
  --pad:clamp(20px,4.4vw,64px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--white);outline-offset:4px}
.skip{position:absolute;left:-9999px;background:var(--white);color:var(--bg);padding:10px 16px;z-index:99}
.skip:focus{left:0;top:0}

/* ---------- typography primitives ---------- */
.lbl{font-family:var(--sans);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.par{font-family:var(--serif);font-style:italic;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.dsp{font-family:var(--serif);font-weight:400;line-height:.92;letter-spacing:-.005em}
h1,h2,h3{margin:0;font-weight:400}

/* ---------- chrome ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(14,19,19,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
.bar-in{display:flex;align-items:center;gap:16px;padding:0 var(--pad);height:58px}
.logo{font-family:var(--serif);font-size:17px;letter-spacing:.16em;text-transform:uppercase}
.barnav{margin-left:auto;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.barnav::-webkit-scrollbar{display:none}
.barnav a{padding:6px 10px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);white-space:nowrap;transition:color .3s}
.barnav a:hover,.barnav a.on{color:var(--white)}
.pillbtn{border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;transition:.35s;white-space:nowrap}
.pillbtn:hover{background:var(--white);color:var(--bg);border-color:var(--white)}

/* ---------- stage ---------- */
.stage{padding:58px 0 0}
.panel{background:var(--panel);border-radius:clamp(10px,1.6vw,20px);margin:14px var(--pad);padding:clamp(26px,5vw,72px) clamp(22px,5vw,72px);position:relative;overflow:hidden}
.panel.deep{background:var(--panel-2)}
.panel.flush{padding:0}
.enter{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* reveal */
.rv{opacity:0;transform:translateY(22px)}
.rv.in{opacity:1;transform:none;transition:opacity 1s cubic-bezier(.16,.8,.3,1),transform 1s cubic-bezier(.16,.8,.3,1)}

/* ---------- hero ---------- */
.hero{min-height:min(78vh,720px);display:flex;flex-direction:column;justify-content:center}
.hero .kick{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:16px;margin-bottom:clamp(24px,5vw,54px)}
.namemark{font-family:var(--serif);font-weight:400;font-size:clamp(2.9rem,13.5vw,9.5rem);line-height:.82;letter-spacing:-.015em;text-transform:uppercase}
.namemark span{display:block}
.hero-foot{display:grid;grid-template-columns:1fr minmax(240px,32%);gap:clamp(20px,4vw,50px);align-items:end;margin-top:clamp(26px,5vw,56px);border-top:1px solid var(--line-2);padding-top:22px}
.hero-foot p{margin:0;color:var(--mute);font-size:13.5px;max-width:46ch}
.hero-right{display:flex;gap:16px;align-items:flex-end;justify-content:flex-end}
.hero-right img{width:66px;height:66px;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.05);flex:none}
.tag{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.1vw,1.5rem);line-height:1.3;max-width:22ch;text-align:right}

/* ---------- section head ---------- */
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:clamp(22px,4vw,44px)}
.shead h2{font-family:var(--serif);font-size:clamp(1.6rem,4.4vw,3rem);line-height:1;text-transform:uppercase;letter-spacing:-.005em}

/* ---------- chapter index ---------- */
.idx{border-top:1px solid var(--line-2)}
.idx a{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1.25fr) 70px;gap:clamp(12px,2.4vw,32px);align-items:center;padding:clamp(16px,2.4vw,26px) 0;border-bottom:1px solid var(--line-2);transition:padding .45s cubic-bezier(.16,.8,.3,1),background .45s}
.idx a:hover{padding-left:16px;padding-right:16px;background:rgba(240,238,232,.028)}
.idx .n{font-family:var(--serif);font-size:12px;color:var(--dim);letter-spacing:.1em}
.idx .t{font-family:var(--serif);font-size:clamp(1.1rem,2.5vw,1.75rem);line-height:1.1;text-transform:uppercase}
.idx .t em{display:block;font-style:normal;font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin-top:8px}
.idx .d{color:var(--mute);font-size:13px;max-width:52ch}
.idx .c{text-align:right;font-family:var(--serif);font-size:11px;color:var(--dim);letter-spacing:.08em}

/* ---------- chapter view ---------- */
.chlede{font-family:var(--serif);font-size:clamp(1.15rem,2.7vw,1.85rem);line-height:1.32;max-width:26ch}
.chgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,60px);align-items:start}
.rolebox{border-top:1px solid var(--line);padding-top:18px;margin-bottom:26px}
.rolebox h3{font-family:var(--serif);font-size:1.15rem;line-height:1.2;margin-bottom:5px}
.rolebox .rm{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.rolebox ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
.rolebox li{color:var(--mute);font-size:13.5px;padding-left:20px;position:relative}
.rolebox li::before{content:"—";position:absolute;left:0;color:var(--dim)}

/* project list */
.plist{border-top:1px solid var(--line-2)}
.plist a{display:grid;grid-template-columns:44px 1fr auto;gap:clamp(12px,2.4vw,26px);align-items:center;padding:clamp(15px,2.2vw,22px) 0;border-bottom:1px solid var(--line-2);transition:padding .45s cubic-bezier(.16,.8,.3,1),background .45s}
.plist a:hover{padding-left:14px;padding-right:14px;background:rgba(240,238,232,.028)}
.plist .n{font-family:var(--serif);font-size:11px;color:var(--dim)}
.plist h3{font-family:var(--serif);font-size:clamp(1rem,2.1vw,1.35rem);line-height:1.18}
.plist p{margin:6px 0 0;color:var(--mute);font-size:12.5px;max-width:62ch}
.plist .go{font-family:var(--serif);font-style:italic;font-size:11px;color:var(--dim);letter-spacing:.1em;white-space:nowrap}
.plist a:hover .go{color:var(--white)}

/* ---------- project view ---------- */
.crumb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:clamp(20px,4vw,40px)}
.crumb a{color:var(--mute)}
.crumb a:hover{color:var(--white)}
.ptitle{font-family:var(--serif);font-size:clamp(1.9rem,6.2vw,4.4rem);line-height:.98;text-transform:uppercase;letter-spacing:-.012em;max-width:15ch}
.pmeta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:clamp(20px,3.4vw,34px);padding-top:18px;border-top:1px solid var(--line-2);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.pmeta b{color:var(--white);font-weight:400}
.pwhat{font-family:var(--serif);font-size:clamp(1.05rem,2.3vw,1.6rem);line-height:1.42;max-width:34ch;margin-top:clamp(24px,4vw,44px)}

/* setup steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.step{background:var(--panel-2);padding:clamp(18px,2.4vw,26px)}
.step .sn{font-family:var(--serif);font-size:11px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:14px}
.step p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.55}
.step p b{color:var(--white);font-weight:400}

/* delivered numerals */
.deliv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(26px,4.5vw,54px) clamp(20px,4vw,40px)}
.deliv > div:nth-child(2n){padding-top:clamp(14px,3vw,42px)}
.deliv > div:nth-child(3n){padding-top:clamp(20px,4.4vw,64px)}
.deliv .num{font-family:var(--serif);font-weight:400;font-size:clamp(2.7rem,7vw,5rem);line-height:.9;letter-spacing:-.02em;display:block}
.deliv .num i{font-size:.42em;font-style:italic;letter-spacing:0;margin-left:.12em;vertical-align:baseline}
.deliv p{margin:14px 0 0;font-size:12.5px;color:var(--mute);max-width:24ch;line-height:1.5}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{border:1px solid var(--line-2);border-radius:100px;padding:7px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin:0 var(--pad) 14px}
.pager a{background:var(--panel);padding:clamp(18px,2.6vw,30px);transition:background .4s}
.pager a:hover{background:var(--panel-2)}
.pager em{font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:9px}
.pager b{font-family:var(--serif);font-weight:400;font-size:clamp(.95rem,1.9vw,1.25rem);line-height:1.15;display:block}
.pager a:last-child{text-align:right}

/* ---------- toolkit / contact ---------- */
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(22px,3.4vw,44px)}
.tk h4{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line-2);font-weight:400}
.tk ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.tk li{font-size:13px;color:var(--mute)}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(22px,3.4vw,44px)}
.edu h3{font-family:var(--serif);font-size:1.15rem;line-height:1.22;margin-bottom:8px}
.edu .w{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.edu p{color:var(--mute);font-size:13px;margin:8px 0 0}
.cbig{font-family:var(--serif);font-size:clamp(2rem,7.4vw,5.2rem);line-height:.98;text-transform:uppercase;letter-spacing:-.015em}
.clist{border-top:1px solid var(--line-2);margin-top:clamp(28px,4.4vw,48px)}
.clist a,.clist span{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;color:var(--mute);transition:padding .4s,color .4s}
.clist a:hover{padding-left:12px;color:var(--white)}
.clist em{font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

footer{padding:26px var(--pad) 40px;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);border-top:1px solid var(--line-2);margin-top:14px}

/* ---------- responsive ---------- */
@media (max-width:880px){
  .hero-foot{grid-template-columns:1fr;gap:22px}
  .hero-right{justify-content:flex-start}
  .tag{text-align:left;max-width:30ch}
  .chgrid{grid-template-columns:1fr}
  .idx a{grid-template-columns:34px 1fr;row-gap:10px}
  .idx .d{grid-column:2}
  .idx .c{display:none}
  .plist a{grid-template-columns:28px 1fr}
  .plist .go{display:none}
  .deliv > div{padding-top:0!important}
  .pager{grid-template-columns:1fr}
  .pager a:last-child{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .rv{opacity:1;transform:none}
}
@media print{
  .bar,.pager{display:none}
  body{background:#fff;color:#000}
  .panel{background:#fff;margin:0;padding:16px 0;border-bottom:1px solid #ddd;border-radius:0}
  .step,.panel.deep{background:#fff}
  .rv{opacity:1;transform:none}
  .step p,.deliv p,.idx .d,.rolebox li,.tk li{color:#333}
}
</style>
</head>

     <div class="hero-right">
       <img src="${PHOTO}" alt="${E(P.name)}">
       <span class="tag">${E(P.tagline)}</span>
     </div>
   </div>
 </section>

 <section class="panel deep rv">
   <div class="shead"><h2>The path</h2><span class="par">(${pad(DATA.chapters.length)} chapters — ${DATA.projects.length} systems)</span></div>
   <nav class="idx">
     ${DATA.chapters.map((c,i)=>`
       <a href="#/c/${c.id}">
         <span class="n">(${pad(i+1)})</span>
         <span class="t">${E(c.title)}<em>${E(c.era)}</em></span>
         <span class="d">${E(c.lede)}</span>
         <span class="c">${chOf(c.id).length} →</span>
       </a>`).join("")}
   </nav>
 </section>

 <section class="panel rv">
   <div class="shead"><h2>Read it<br>however you like</h2><span class="par">(Three ways in)</span></div>
   <nav class="plist">
     <a href="#/c/origin"><span class="n">(01)</span><span><h3>Start at the beginning</h3><p>Seven chapters in order — how a commercial operator became the person who builds the tooling.</p></span><span class="go">In order</span></a>
     <a href="#/p/looker"><span class="n">(02)</span><span><h3>Jump to the strongest work</h3><p>The Looker semantic layer, the Mirakl pipeline and the boutique web app.</p></span><span class="go">Best of</span></a>
     <a href="#/toolkit"><span class="n">(03)</span><span><h3>Just show me the stack</h3><p>Tools, education and languages, on one page.</p></span><span class="go">Toolkit</span></a>
   </nav>
 </section>`;
}

function chapter(id){
 const c=getCh(id); if(!c) return home();
 const i=DATA.chapters.indexOf(c), prev=DATA.chapters[i-1], next=DATA.chapters[i+1];
 const list=chOf(id);
 return `
 <section class="panel rv">
   <div class="crumb"><a href="#/">Index</a><span>/</span><span>Chapter ${pad(i+1)}</span></div>
   <div class="chgrid">
     <div>
       <span class="par">(${E(c.era)})</span>
       <h1 class="dsp" style="font-size:clamp(2rem,6.4vw,4.6rem);text-transform:uppercase;margin-top:16px">${E(c.title)}</h1>
     </div>
     <p class="chlede">${E(c.lede)}</p>
   </div>
 </section>

 <section class="panel deep rv">
   <div class="shead"><h2>The role</h2><span class="par">(Where I was)</span></div>
   ${c.roles.map(r=>`
     <div class="rolebox">
       <p class="rm">${E(r.when)} — ${E(r.org)}</p>
       <h3>${E(r.title)}</h3>
       <ul>${r.points.map(p=>`<li>${E(p)}</li>`).join("")}</ul>
     </div>`).join("")}
 </section>

 ${list.length?`
 <section class="panel rv">
   <div class="shead"><h2>What I built</h2><span class="par">(${pad(list.length)} ${list.length===1?"system":"systems"})</span></div>
   <nav class="plist">
     ${list.map((p,k)=>`
       <a href="#/p/${p.id}">
         <span class="n">(${pad(k+1)})</span>
         <span><h3>${p.name}</h3><p>${E(p.what)}</p></span>
         <span class="go">Open</span>
       </a>`).join("")}
   </nav>
 </section>`:""}

 <nav class="pager">
   ${prev?`<a href="#/c/${prev.id}"><em>← Previous</em><b>${E(prev.title)}</b></a>`:`<a href="#/"><em>← Back</em><b>Index</b></a>`}
   ${next?`<a href="#/c/${next.id}"><em>Next →</em><b>${E(next.title)}</b></a>`:`<a href="#/contact"><em>End of the path →</em><b>Contact</b></a>`}
 </nav>`;
}

function project(id){
 const p=getPr(id); if(!p) return home();
 const c=getCh(p.ch), sibs=chOf(p.ch), k=sibs.indexOf(p);
 const prev=sibs[k-1], next=sibs[k+1];
 return `
 <section class="panel rv">
   <div class="crumb"><a href="#/">Index</a><span>/</span><a href="#/c/${c.id}">${E(c.title)}</a><span>/</span><span>${pad(k+1)}</span></div>
   <h1 class="ptitle">${p.name}</h1>
   <div class="pmeta">
     <span>Where — <b>${E(p.org)}</b></span>
     <span>When — <b>${E(p.when)}</b></span>
     <span>Chapter — <b>${E(c.title)}</b></span>
   </div>
   <p class="pwhat">${E(p.what)}</p>
 </section>

 <section class="panel rv">
   <div class="shead"><h2>How it was set up</h2><span class="par">(The build)</span></div>
   <div class="steps">
     ${p.setup.map((s,n)=>`<div class="step"><span class="sn">(${pad(n+1)})</span><p>${s}</p></div>`).join("")}
   </div>
   ${p.note?`<p class="lbl" style="margin-top:22px;letter-spacing:.14em">Constraint — ${E(p.note)}</p>`:""}
 </section>

 <section class="panel deep rv">
   <div class="shead"><h2>What it delivered</h2><span class="par">(The result)</span></div>
   <div class="deliv">
     ${p.delivered.map(d=>`<div><span class="num">${d[0]}</span><p>${E(d[1])}</p></div>`).join("")}
   </div>
 </section>

 <section class="panel rv">
   <div class="shead"><h2>Built with</h2><span class="par">(Stack)</span></div>
   <div class="tools">${p.tools.map(t=>`<span>${E(t)}</span>`).join("")}</div>
 </section>

 <nav class="pager">
   ${prev?`<a href="#/p/${prev.id}"><em>← Previous</em><b>${prev.name}</b></a>`
        :`<a href="#/c/${c.id}"><em>← Back to chapter</em><b>${E(c.title)}</b></a>`}
   ${next?`<a href="#/p/${next.id}"><em>Next →</em><b>${next.name}</b></a>`
        :`<a href="#/c/${c.id}"><em>Chapter complete →</em><b>${E(c.title)}</b></a>`}
 </nav>`;
}

function toolkit(){
 return `
 <section class="panel rv">
   <div class="crumb"><a href="#/">Index</a><span>/</span><span>Toolkit</span></div>
   <h1 class="ptitle">The stack</h1>
   <p class="pwhat">Listed only where a system in this portfolio backs it up. Every line here has a page you can open.</p>
 </section>

 <section class="panel deep rv">
   <div class="shead"><h2>Tools</h2><span class="par">(In practice)</span></div>
   <div class="tk">
     ${DATA.toolkit.map(t=>`<div><h4>${E(t.group)}</h4><ul>${t.items.map(i=>`<li>${E(i)}</li>`).join("")}</ul></div>`).join("")}
   </div>
 </section>

 <section class="panel rv">
   <div class="shead"><h2>Education</h2><span class="par">(Formal)</span></div>
   <div class="edu">
     ${DATA.education.map(e=>`<div><p class="w">${E(e.when)}</p><h3>${E(e.title)}</h3><p>${E(e.org)}</p>${e.note?`<p>${E(e.note)}</p>`:""}</div>`).join("")}
   </div>
   <div class="shead" style="margin-top:clamp(30px,5vw,56px)"><h2>Languages</h2><span class="par">(Spoken)</span></div>
   <div class="tools">${DATA.languages.map(l=>`<span>${E(l)}</span>`).join("")}</div>
 </section>

 ${DATA.interests.length?`
 <section class="panel deep rv">
   <div class="shead"><h2>Beyond the work</h2><span class="par">(Off the clock)</span></div>
   <div class="edu">${DATA.interests.map(x=>`<div><h3>${E(x.name)}</h3><p>${E(x.note)}</p></div>`).join("")}</div>
 </section>`:""}`;
}

function contact(){
 const rows=[`<a href="mailto:${P.email}"><span>${E(P.email)}</span><em>Email</em></a>`,
             `<a href="${P.linkedin}" target="_blank" rel="noopener"><span>LinkedIn</span><em>Profile</em></a>`];
 if(P.showPhone&&P.phone) rows.push(`<a href="tel:${P.phone.replace(/\s/g,"")}"><span>${E(P.phone)}</span><em>Phone</em></a>`);
 if(P.cvUrl) rows.push(`<a href="${P.cvUrl}" target="_blank" rel="noopener"><span>Curriculum vitae</span><em>PDF</em></a>`);
 rows.push(`<span><span>${E(P.location)}</span><em>Based in</em></span>`);
 return `
 <section class="panel rv">
   <div class="crumb"><a href="#/">Index</a><span>/</span><span>Contact</span></div>
   <span class="par">(End of the path)</span>
   <h1 class="cbig" style="margin-top:18px">Let's talk about<br>what you need built</h1>
   <p class="pwhat">${E(P.availability)}</p>
   <div class="clist">${rows.join("")}</div>
 </section>`;
}

/* ---------- router ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});

function route(){
 const q=(location.hash||"#/").replace(/^#\/?/,"").split("/");
 const a=q[0],b=q[1];
 let html,mark=null;
 if(a==="c"&&b){html=chapter(b);mark=b}
 else if(a==="p"&&b){const p=getPr(b);html=project(b);mark=p?p.ch:null}
 else if(a==="toolkit"){html=toolkit();mark="toolkit"}
 else if(a==="contact"){html=contact()}
 else html=home();

 const s=$("#stage");
 s.innerHTML=`<div class="enter">${html}</div>`;
 document.querySelectorAll("#barnav a").forEach(x=>x.classList.toggle("on",x.dataset.ch===mark));
 s.querySelectorAll(".rv").forEach((n,i)=>{n.style.transitionDelay=(i*70)+"ms";io.observe(n)});
 window.scrollTo({top:0,behavior:"instant"});
 s.focus({preventScroll:true});
}
addEventListener("hashchange",route);
addEventListener("beforeprint",()=>document.querySelectorAll(".rv").forEach(n=>n.classList.add("in")));
route();
</script>
</body>
</html>
